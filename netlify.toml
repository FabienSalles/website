[build]
    functions = "netlify/functions"

# Pages supprimées qui recevaient encore des impressions Search Console.
# Sans ces règles, les requêtes qui les classaient tombent sur un 404.
[[redirects]]
    from = "/formations/tdd"
    to = "/formations/phpunit/"
    status = 301
    force = true

[[redirects]]
    from = "/formations/clean-code"
    to = "/formations/"
    status = 301
    force = true

[[redirects]]
    from = "/about"
    to = "/"
    status = 301
    force = true

[[redirects]]
    from = "/cv"
    to = "/"
    status = 301
    force = true

# Umami served first-party so ad-blockers filtering the umami.salles.dev
# domain don't drop the tracking script or the events it sends.
[[redirects]]
    from = "/stats.js"
    to = "https://umami.salles.dev/script.js"
    status = 200
    force = true

[[redirects]]
    from = "/api/send"
    to = "https://umami.salles.dev/api/send"
    status = 200
    force = true
